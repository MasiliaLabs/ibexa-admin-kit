name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    composer:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  coverage: none
            - run: composer validate --strict

    admin:
        name: Admin scripts
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: src/bundle/Resources/public/admin
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '24'
            # The tests need no package: Node reads the TypeScript sources as they are.
            - run: node --experimental-strip-types --import ./test-hooks/register.mjs --test *.test.ts
